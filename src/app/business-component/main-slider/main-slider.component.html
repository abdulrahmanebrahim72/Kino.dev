<owl-carousel-o [options]="customOptions">

    <ng-container *ngFor="let slide of slidesStore">
      <ng-template carouselSlide [id]="slide?.id">
        <div class="item m-2">
            <a routerLink="/movieDetails/{{slide?.id}}">
                <img [src]="imgSrc+slide?.poster_path" class="w-100">
            </a>
        </div>
        <p class="text-center fw-medium">{{slide?.title}}</p>
        <div [class]="slide.vote_average >= 5? 'bg-info rate':'bg-danger rate'">{{slide.vote_average.toFixed(1)}}</div>
      </ng-template>
    </ng-container>

</owl-carousel-o>
