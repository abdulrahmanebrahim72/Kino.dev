<div class="container mb-4">
    <h1 class="text-center mt-5 mb-5"><span class="text-danger fw-bold">{{title}}</span> Movies</h1>
    <div class="row">
        <div *ngFor="let item of movieList | paginate: { id: 'moviesPaginate',
                                            itemsPerPage: 20,
                                            currentPage: curentPage,
                                            totalItems: total } " class="col-md-2 mt-3" >
            <figure>
                <div class="item position-relative">
                    <div [class]="item?.vote_average >= 5? 'bg-info rate':'bg-danger rate'" >
                        {{item?.vote_average.toFixed(1)}}
                    </div>
                    <a routerLink="/movieDetails/{{item.id}}">
                        <img *ngIf="item?.poster_path != null" class="w-100" [src]="imgSrc+item?.poster_path">
                        <img *ngIf="item?.poster_path == null" class="w-100" src="../../../assets/nf.jpg">
                    </a>
                </div>
                <figcaption>
                    <h6 class="text-center p-1">{{item?.title}}{{item?.name}}</h6>
                </figcaption>
            </figure>
        </div>
    </div>

    <div class="d-flex justify-content-center my-5 text-light">
        <pagination-controls  id="moviesPaginate"
                      (pageChange)="pageChanged($event)"
                      (pageBoundsCorrection)="pageChanged($event)"
                      [maxSize]="5"
                      [directionLinks]="true"
                      [autoHide]="true"
                      [responsive]="true"
                      previousLabel="Previous"
                      nextLabel="Next"
                      screenReaderPaginationLabel="Pagination"
                      screenReaderPageLabel="page"
                      screenReaderCurrentLabel="You're on page">
        </pagination-controls>
    </div>

</div>
